version: '3.8'

services:
  # Neo4j 图数据库
  neo4j:
    image: neo4j:5.13.0
    container_name: kg-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_server_memory_pagecache_size=256M
      - NEO4J_server_memory_heap_initial__size=512M
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kg-network

  # KG Builder 应用
  kg-builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kg-builder
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      # 可选：通过环境变量配置API Key
      # - ZHIPU_API_KEY=your_key_here
      # - OPENAI_API_KEY=your_key_here
      # - ANTHROPIC_API_KEY=your_key_here
    volumes:
      - ./.data:/app/.data  # 持久化状态数据
      - ./uploads:/app/uploads  # 上传文件目录
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - kg-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:

networks:
  kg-network:
    driver: bridge